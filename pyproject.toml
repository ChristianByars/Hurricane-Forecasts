[project]
name = "hurricane-forecasts"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "earth2studio[aifs2,data,fcn3,aurora]",
    "torch>=2.4.0",
    "torch-harmonics>=0.8.0",
    "xarray>=2024.1.0",
    "zarr>=2.18.0",
    "gcsfs>=2024.1.0",
    "h5py>=3.11.0",
    "matplotlib>=3.8.1",
    "cartopy>=0.22.0",
    "numpy>=1.22.4",
    "scipy>=1.10.0",
    "tqdm>=4.60.0",
    "pandas>=2.0.0",
    "nvidia-ml-py",
]

[dependency-groups]
dev = ["ipykernel>=7.1.0"]

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "main" }
torch = { index = "pytorch-cu124" }

[tool.uv]
# Pin flash-attn to the version already built in the venv (2.8.3.post1 has no wheel
# and its source build fails under isolation). torch-harmonics/warp overrides as before.
override-dependencies = ["torch-harmonics==0.8.1", "warp-lang<1.13", "flash-attn==2.8.3"]
index-strategy = "unsafe-best-match"

# Safety net: if flash-attn is ever rebuilt from source, give its isolated build env torch
# (its setup.py imports torch but doesn't declare it as a build dependency).
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
priority = "supplemental"
